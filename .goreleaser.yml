version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    # Keep the default architectures and add only the missing ports from #361.
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - ppc64
      - riscv64
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: ppc64
      - goos: windows
        goarch: riscv64
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: ppc64
      - goos: darwin
        goarch: riscv64
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-devel"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
